paths:
  data_dir: ../RoboMasterClient/RoboMasterClient_Data
  resources_asset: resources.assets
  global_managers: globalgamemanagers
  client_scene: level1

screen:
  width: 2560
  height: 1440
  dpi: 96

# Use "auto" to read these values from the client scene's CanvasScaler.
canvas:
  ui_scale_mode: auto
  reference_width: auto
  reference_height: auto
  scale_factor: auto
  screen_match_mode: auto
  match_width_or_height: auto
  fallback_dpi: auto
  default_sprite_dpi: auto
  physical_unit: auto

filters:
  # ResourceManager paths, matched case-insensitively.
  include_resource_globs:
    - "prefabs/ui/**"
  exclude_resource_globs: []
  component_types:
    - Button
  # Dynamic competition buttons are often serialized as inactive.
  include_inactive: true

output:
  directory: output
  json_file: buttons.json
  csv_file: buttons.csv
